; MeshMaster agent firmware - PlatformIO project configuration.
;
; MeshCore is a LIBRARY here, pinned at one commit: our application lives in src/ and not one
; file of upstream's tree is edited, so keeping up with MeshCore is a one-line change to
; [meshcore].pin with no conflicts in files that are not ours (docs/upstream.md).
;
; The flag blocks of [heltec_v3] and [heltec_v4] below are MeshCore's own, copied from its
; variants/heltec_v3/platformio.ini and variants/heltec_v4/platformio.ini at the pin and composed
; with [arduino_base], [esp32_base] and [sensor_base] of its root platformio.ini. Those sections
; live upstream and cannot be reached from here (they use paths relative to MeshCore's root), so
; a pin bump has to re-read them: docs/upstream.md says so and tasks/sync/TEMPLATE.md asks for it.
; The one file of upstream's that is copied into this repository is boards/heltec_v4.json, and
; boards/README.md says why.
;
;   pio run -e heltec_v3      build the first board
;   pio run -e heltec_v4      build the second (task 06)
;   pio test -e native        the tests that need no board
;
; src/ is this board (task 01 onward): main.cpp, the console, settings, WiFi, the clock, the TLS
; client, the OLED and the mesh. MeshCore contributes its core (src/), the Heltec V3 variant and
; the display driver, selected by the MC_VARIANT and DISPLAY_CLASS defines below; no example of
; upstream's is built.
;
; lib/agent-core/ is the agent itself (task p1.5-16): the job runner, the agent loop, the
; envelopes and results of the agent API, the reply codec, the airtime budget, the session cache,
; the observation ring, the offline result buffer, the backoff and the log's formatting - every
; portable file of the agent, behind the three interfaces of task p1.5-15 and with nothing of
; Arduino, the ESP-IDF, WiFi, NVS or MeshCore in it. It is a PlatformIO library of this project,
; found by the project's own lib/ discovery and compiled **whole** in every environment, this
; repository's boards and [env:native] alike; its manifest is lib/agent-core/library.json and
; test/test_library holds its boundary. Reached as <agent/...> from src/ and from the tests.

[meshcore]
; The commit the field repeater runs: companion-v1.17.1. Bumped by .github/workflows/upstream.yml.
pin = d92964352441e53b93e8667b802e04f6e072b39e
tag = companion-v1.17.1
url = https://github.com/meshcore-dev/MeshCore.git
; Where PlatformIO puts it, for the -I flags the variant and the example need.
dir = $PROJECT_LIBDEPS_DIR/$PIOENV/MeshCore

[libs]
; Versions are exact, not ranges: a firmware build has to be reproducible, and MeshCore's own
; ranges (its library.json and platformio.ini) would float under us between two builds of the
; same commit. Every number below is the newest release that satisfies what MeshCore asks for,
; resolved once and written down; a pin bump re-resolves them (docs/upstream.md).
;
;   RadioLib          the SX1262 driver. MeshCore's platformio.ini pins a git commit
;                     (7.7.1+sha.6d89348) that is not a registry release; installing it beside
;                     MeshCore's own "^7.6.0" gives two libraries for one RadioLib.h, so this is
;                     the registry release that satisfies that range instead - the one thing here
;                     that is not byte-for-byte MeshCore's choice, and a line for every bump to
;                     re-read
;   Crypto            Ed25519 and SHA-256 for MeshCore's identities and packets
;   RTClib, RV3028    MeshCore's clock helpers (compiled whether a board has an RTC or not)
;   CayenneLPP        the telemetry encoding of MeshCore's sensor helpers
;   BusIO, ArduinoJson
;                     transitive, and declared here because upstream asks for them with "*"
;   base64            the companion example's serial framing
;   Adafruit/*, INA*, SHT*, LPS22HB, MicroNMEA, VL53L0X
;                     MeshCore's src/helpers/sensors, which build_as_lib.py compiles into every
;                     build whether a sensor is fitted or not - so they are not optional here
core =
  SPI
  Wire
  jgromes/RadioLib @ 7.8.0
  rweather/Crypto @ 0.4.0
  adafruit/RTClib @ 2.1.4
  adafruit/Adafruit BusIO @ 1.17.4
  melopero/Melopero RV3028 @ 1.2.0
  electroniccats/CayenneLPP @ 1.6.1
  bblanchon/ArduinoJson @ 7.4.3
sensors =
  adafruit/Adafruit INA3221 Library @ 1.0.1
  adafruit/Adafruit INA219 @ 1.2.3
  robtillaart/INA226 @ 0.6.6
  adafruit/Adafruit INA260 Library @ 1.5.3
  adafruit/Adafruit AHTX0 @ 2.0.6
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BMP280 Library @ 2.6.8
  adafruit/Adafruit SHTC3 Library @ 1.0.2
  sensirion/Sensirion I2C SHT4x @ 1.1.2
  arduino-libraries/Arduino_LPS22HB @ 1.0.3
  adafruit/Adafruit MLX90614 Library @ 2.1.6
  adafruit/Adafruit_VL53L0X @ 1.2.5
  stevemarple/MicroNMEA @ 2.0.6
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BMP085 Library @ 1.2.4

[platformio]
default_envs = heltec_v3

; ----------------------------------------------------------------------------------------------
; MeshCore's [arduino_base] and [esp32_base], as a library consumer sees them
; ----------------------------------------------------------------------------------------------

[esp32_base]
framework = arduino
platform = platformio/espressif32@6.11.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D ESP32_PLATFORM
; Two of MeshCore's own flags are deliberately absent. ENABLE_PRIVATE_KEY_IMPORT and _EXPORT:
; this board's identity is generated on it and never leaves it (the rails in README.md). And -w,
; which inhibits every warning - GCC's -w wins over a later -Wall no matter the order, so with it
; the -Werror below would say nothing at all. Without it the whole build, upstream included,
; prints 15 warning lines; that is a price worth paying for a strict build of our own sources.
;
; build_src_flags reaches src/ only: this is the -warnaserror of twinoak/meshmaster.dk. (The
; espressif framework demotes a few of its own with -Wno-error=..., e.g. unused-variable; what
; is left still fails a build, which is what matters.) Since task p1.5-16 half of what this flag
; used to cover lives in lib/agent-core, which a build_src_flags cannot reach - so the library
; carries the same three flags in its own library.json build.flags, and is -Werror wherever it is
; built, here and in a consumer's tree alike.
build_src_flags = -Wall -Wextra -Werror
lib_deps =
  ${meshcore.url}#${meshcore.pin}
  ${libs.core}

; ----------------------------------------------------------------------------------------------
; The boards
; ----------------------------------------------------------------------------------------------

; Heltec LoRa32 V3 (ESP32-S3 + SX1262 + SSD1306), the first target. The flags are MeshCore's
; variants/heltec_v3/platformio.ini [Heltec_lora32_v3] plus its [sensor_base], and two defines
; are how build_as_lib.py is told which of MeshCore's own sources to compile:
;   MC_VARIANT            variants/heltec_v3 (the board object, the radio, the RTC, the display)
;   DISPLAY_CLASS         helpers/ui/SSD1306Display.cpp
; No BUILD_EXAMPLE: the application is src/ (task 01), and MeshCore's examples are not built.
; The two MESHMASTER_MESHCORE_* defines carry the pin into the firmware string `status` prints,
; so a bump moves them with the pin and never by hand.
[env:heltec_v3]
extends = esp32_base
board = esp32-s3-devkitc-1
; The board's own table is the framework's default_8MB.csv, which keeps NVS at 0x9000 - inside
; the span a merged image fills with 0xFF, so every merged flash erased the settings. This one is
; that table with NVS moved above the application and nothing else moved (boards/README.md);
; tools/check-partitions.py holds it against the framework's default in CI, every build.
board_build.partitions = boards/partitions/meshmaster_8MB.csv
extra_scripts =
  pre:tools/pio/meshcore_private_libs.py
  post:tools/pio/merge_bin.py
; MeshCore's headers reach src/ through src/mesh/MeshCoreHeaders.h, which declares itself a system
; header so that upstream's warnings are not our errors. A `#warning` directive is reported from a
; system header all the same (RadioLib's "God mode active" is one), so that one stays a warning.
build_src_flags =
  ${esp32_base.build_src_flags}
  -Wno-error=cpp
build_flags =
  ${esp32_base.build_flags}
  -I ${meshcore.dir}/variants/heltec_v3
  -I ${meshcore.dir}/lib/ed25519
  -D MC_VARIANT=heltec_v3
  -D MESHMASTER_MESHCORE_TAG='"${meshcore.tag}"'
  -D MESHMASTER_MESHCORE_PIN='"${meshcore.pin}"'
  -D MESHMASTER_BOARD='"heltec_v3"'
  -D HELTEC_LORA_V3
  -D ESP32_CPU_FREQ=80
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=35
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=47
  -D PIN_GPS_TX=48
  -D PIN_GPS_EN=26
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
; NOTE: MESH_PACKET_LOGGING and MESH_DEBUG are never enabled - nothing the mesh says is logged
; as text (the rails in README.md).
;
;   Adafruit SSD1306, GFX   the OLED, which MeshCore's SSD1306Display.cpp and src/ui/Oled.cpp
;                           draw on; they arrived transitively before task 01 and are pinned now
;                           that our own code depends on them
;   base64                  helpers/BaseChatMesh.cpp includes it, and build_as_lib.py compiles
;                           every helpers/*.cpp whether the application uses it or not
lib_deps =
  ${esp32_base.lib_deps}
  ${libs.sensors}
  adafruit/Adafruit SSD1306 @ 2.5.17
  adafruit/Adafruit GFX Library @ 1.12.6
  densaugeo/base64 @ 1.4.0

; Heltec LoRa32 V4 with the OLED (ESP32-S3 + SX1262 + an external PA + SSD1306), task 06's
; target. The flags are MeshCore's variants/heltec_v4/platformio.ini [Heltec_lora32_v4] and
; [heltec_v4_oled] plus its [sensor_base], composed the same way the V3 above is.
;
; Two things are this environment's own and nobody else's:
;
;   boards/heltec_v4.json   MeshCore's board definition, vendored unedited, because
;                           PlatformIO reads boards_dir before it clones a dependency and a
;                           `board =` cannot name a file inside one (boards/README.md). The V3
;                           needs none: its board is PlatformIO's own esp32-s3-devkitc-1, which
;                           is what MeshCore's own V3 variant uses too. The Arduino variant the
;                           definition names is *not* vendored - `-I .../variants/heltec_v4`
;                           below puts its pins_arduino.h on the include path, which is how
;                           MeshCore reaches its own.
;
;   MESHMASTER_TX_DBM_DEFAULT   10, not the V3's 22. The V4's PA is enabled for every
;                           transmission (variants/heltec_v4/LoRaFEMControl.cpp), and upstream's
;                           own comment beside LORA_TX_POWER=10 says 10 at the chip is 22 dBm at
;                           the socket. The key's range is unchanged - -9..22 is
;                           MAX_LORA_TX_POWER on both boards - so only what a board out of the
;                           box transmits at moves (src/settings/Keys.cpp).
[env:heltec_v4]
extends = esp32_base
board = heltec_v4
; boards/heltec_v4.json names default_16MB.csv; this overrides it with the same table moved the
; same way as the V3's (NVS above the application, spiffs where the default has it). The board
; definition itself stays unedited, as boards/README.md promises.
board_build.partitions = boards/partitions/meshmaster_16MB.csv
extra_scripts =
  pre:tools/pio/meshcore_private_libs.py
  post:tools/pio/merge_bin.py
build_src_flags =
  ${esp32_base.build_src_flags}
  -Wno-error=cpp
build_flags =
  ${esp32_base.build_flags}
  -I ${meshcore.dir}/variants/heltec_v4
  -I ${meshcore.dir}/lib/ed25519
  -D MC_VARIANT=heltec_v4
  -D MESHMASTER_MESHCORE_TAG='"${meshcore.tag}"'
  -D MESHMASTER_MESHCORE_PIN='"${meshcore.pin}"'
  -D MESHMASTER_BOARD='"heltec_v4"'
  -D MESHMASTER_TX_DBM_DEFAULT='"10"'
  -D HELTEC_LORA_V4
  -D HELTEC_LORA_V4_OLED
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7
  -D P_LORA_GC1109_PA_EN=2
  -D P_LORA_GC1109_PA_TX_EN=46
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D LORA_TX_POWER=10
  -D MAX_LORA_TX_POWER=22
  -D SX126X_REGISTER_PATCH=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=38
  -D PIN_GPS_TX=39
  -D PIN_GPS_RESET=42
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D PIN_GPS_EN=34
  -D PIN_GPS_EN_ACTIVE=LOW
  -D PIN_ADC_CTRL=37
  -D PIN_VBAT_READ=1
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  ${esp32_base.lib_deps}
  ${libs.sensors}
  adafruit/Adafruit SSD1306 @ 2.5.17
  adafruit/Adafruit GFX Library @ 1.12.6
  densaugeo/base64 @ 1.4.0

; ----------------------------------------------------------------------------------------------
; The tests that need no board
; ----------------------------------------------------------------------------------------------

; A host build: no Arduino, no MeshCore, no radio. FIXTURES_DIR and COMPANION_DIR are how the
; fixture tests find tests/fixtures/contracts and tests/fixtures/companion without assuming the
; working directory pio test runs it from, and PROJECT_DIR is how the TLS-policy test walks the
; tree and the parser test reads README.md.
; The MESHMASTER_MESHCORE_* defines are the board build's own, so that src/version.cpp says the
; same thing here as it does on the board and test_envelopes can hold the heartbeat's two
; firmware fields against what `status` prints.
;
; **lib/agent-core is compiled whole here**, and not by a filter: it is a library of this
; project, so PlatformIO's own lib/ discovery finds it the moment a test includes one of its
; headers and then builds every source it has - the job runner and the agent loop among them, for
; the first time (task p1.5-16). That is why there is no agent-core line in lib_deps: a bare name
; there would send PlatformIO to the registry looking for a package, and a project's own lib/
; needs no declaration. test/test_library takes the address of JobRunner::claimAndRun and
; AgentLoop::loop, so a library that stopped being compiled and linked here would fail to link.
;
; build_src_filter keeps what is left of src/ that the tests still need and that a host can
; compile: the key table, the console parser, the OLED's four lines, the version string and,
; since task p1.7-26, the portable half of the observer dialect (src/observer/ less Observer.cpp,
; which is the board's) - and since task p1.7-27 the broker connection's state machine
; (observer/Connection.cpp), which test/test_connection drives with a fake client and a fake
; clock. Everything else in src/ needs a board.
;
; **MeshCore is installed here but not built** (task p1.7-26). test/test_observer verifies the
; observer's sign-in token with the Ed25519 this firmware signs it with - MeshCore's own
; lib/ed25519, the private library tools/pio/meshcore_private_libs.py compiles for the boards -
; so the same pinned checkout is a lib_deps entry of this environment too, lib_ignore keeps the
; LDF from building MeshCore itself (its sources need Arduino and a radio), and the same script
; adds the ed25519 sources to this build from the checkout, never from a copy in this tree.
[env:native]
platform = native
test_framework = googletest
test_build_src = yes
extra_scripts =
  pre:tools/pio/meshcore_private_libs.py
build_flags =
  -std=c++17
  -Wall -Wextra -Werror
  -I ${meshcore.dir}/lib/ed25519
  -D FIXTURES_DIR='"$PROJECT_DIR/tests/fixtures/contracts"'
  -D COMPANION_DIR='"$PROJECT_DIR/tests/fixtures/companion"'
  -D PROJECT_DIR='"$PROJECT_DIR"'
  -D MESHMASTER_MESHCORE_TAG='"${meshcore.tag}"'
  -D MESHMASTER_MESHCORE_PIN='"${meshcore.pin}"'
build_src_filter =
  -<*>
  +<settings/Keys.cpp>
  +<console/Parser.cpp>
  +<ui/DisplayLines.cpp>
  +<version.cpp>
  +<observer/Frame.cpp>
  +<observer/Dialect.cpp>
  +<observer/Token.cpp>
  +<observer/Presets.cpp>
  +<observer/Topics.cpp>
  +<observer/Config.cpp>
  +<observer/Connection.cpp>
lib_deps =
  google/googletest @ 1.17.0
  bblanchon/ArduinoJson @ 7.4.3
  ${meshcore.url}#${meshcore.pin}
lib_ignore =
  MeshCore
