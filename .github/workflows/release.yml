# WHERE THIS RUNS: all three jobs on GitHub's runners, like every job of ci.yml and upstream.yml,
# because **this repository is public**. Actions on standard GitHub-hosted runners are free in a
# public repository, and a public repository is the one place a self-hosted runner must not be: a
# fork can open a pull request that changes a workflow, and it would then run on the Unraid host.
# It is the stronger reason here than anywhere - this is the file that builds the images people
# flash and signs them into a Release. ci.yml's guard, tools/check-runners.py, fails if any job of
# any workflow here moves to a self-hosted runner (task p1.8-29).
#
# THE BUTTON PUBLISHES (task p1.11-52, pile 1.11's README). There is one trigger and nothing is
# typed into it:
#
#   workflow_dispatch              -> release the version the repository names, from master's head
#   workflow_dispatch, dry run     -> the same build, published nowhere: a rehearsal whose
#                                     artifacts are the proof that the real press works. 0.0.0-dryrun,
#                                     and the one case that may name another `ref`.
#
# **A tag starts nothing.** Until this task a release was a pushed tag and four things done by
# hand - the *What's new* text edited inside this file, CHANGELOG.md's heading, the library's
# version in three manifests, and the tag itself (tasks/phase-1.10/51 did all four). Now:
#
#   the version   is in `VERSION` at the root, in one place, and it names the release that comes
#                 NEXT. The three manifests that carry the library's version copy it and CI fails
#                 when one does not (tools/release.ps1 -Action check, test/test_library). This
#                 workflow reads the number from there and from nowhere else.
#   the notes     write themselves. A task that changes something a person will notice leaves one
#                 line in release-notes/unreleased/<task>.md, as meshmaster.dk's tasks do; *What's
#                 new* is those lines, in the order the tasks merged. The standing parts below -
#                 the flasher, the table of files, the console lines - are this file's and stay.
#   it refuses    before anything is built, in one sentence: no line waiting, the version's tag
#                 already there, or a release asked for from a ref that is not master.
#   afterwards    one pull request, opened and merged by this workflow: the lines move into
#                 release-notes/vX.Y.Z.md as published, the version moves to the next patch in all
#                 four places, and CHANGELOG.md's next section opens.
#
# docs/release.md is the page. tools/release.ps1 is where every one of those decisions is taken,
# with a self-test CI runs against a scratch repository, so that none of it lives in shell here.
#
# Per board it publishes:
#   meshmaster-agent-<board>-vX.Y.Z.bin          the application image at 0x10000: the upgrade
#                                                for a board already running this firmware
#   meshmaster-agent-<board>-vX.Y.Z-merged.bin   bootloader + partitions + application, one file,
#                                                flashed at 0x0 on a board out of the box or one
#                                                coming from other firmware
#   SHA256SUMS                                   for all of them, one file
# Either image keeps a provisioned board's settings and its identity: this firmware's partition
# table puts NVS above the application, where a merged image cannot reach it (boards/README.md,
# task p1.2-11). The one exception is the first merged flash over a board provisioned under
# v0.1.1 or earlier, whose table kept NVS at 0x9000 inside the span a merged image fills with
# 0xFF: that flash forgets the settings and not the identity. The notes are for a person with
# the MeshCore web flasher (its *Custom firmware* writes a -merged.bin at 0x0 after erasing the
# whole flash, and any other .bin at 0x10000): which file is a first install and which is an
# upgrade, the console lines that set up WiFi, the token and the observer, and the MeshCore tag.
#
# The version the board reports is the release's: -D MESHMASTER_AGENT_VERSION="X.Y.Z+<sha7>",
# which src/version.cpp turns into the string F-01's `status` command and the heartbeat's
# agentVersion read. A dry run says 0.0.0-dryrun+<sha7> so an artifact can never be mistaken for
# a release.

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: the same build, nothing published, 0.0.0-dryrun."
        type: boolean
        default: false
      ref:
        description: "A dry run's commit or branch. A real release is always master's head and refuses anything else."
        type: string
        default: ""

permissions:
  contents: read

# One release at a time, and none is ever cancelled half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PIO_VERSION: "6.1.19"
  PYTHONUNBUFFERED: "1"

jobs:
  # Everything that can say no, before a byte is compiled: the refusals of tools/release.ps1's
  # `plan`, and then the rule this job has had since the first release - nothing is released whose
  # build and tests are red or unknown.
  gate:
    name: ${{ (inputs.dry_run && 'the rehearsal, and ci') || 'the refusals, and ci' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.full }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      lines: ${{ steps.plan.outputs.lines }}
    steps:
      # A real release is master's head and nothing else, so that is what is checked out whatever
      # was typed; `plan` below refuses the press that asked for something different rather than
      # quietly releasing master instead. Only a dry run may name another ref, and a dry run that
      # names none rehearses on the ref it was pressed from - which is how a task rehearses its
      # own branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.dry_run && (inputs.ref || github.ref)) || 'master' }}
          fetch-depth: 0

      # `plan` needs the tags (is this version's tag already there?) and origin/master (is this
      # commit its head?). checkout fetches both at fetch-depth 0; this is the belt.
      - name: The refs it decides from
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin
          git fetch --quiet origin master:refs/remotes/origin/master || true

      # The version, the tag, and the three refusals - each one sentence, each before anything is
      # built. A dry run refuses nothing and prints what a real release would have refused, so that
      # the rehearsal rehearses that too.
      - name: What this press will do, and what would stop it
        id: plan
        shell: pwsh
        run: |
          $dry = '${{ inputs.dry_run }}' -eq 'true'
          ./tools/release.ps1 -Action plan -Ref '${{ inputs.ref || github.ref_name }}' -DryRun:$dry

      # Which commit ci really ran on. The pull request this workflow merges after a release gets
      # NO ci run of its own - GitHub starts no workflow from an event raised with the job's own
      # token - so at the release AFTER one, master's head is a commit ci has never seen and the
      # wait below would time out on a run that is never coming. `ci-commit` walks the head back
      # over commits that are the github-actions bot's AND touch nothing but the release's own
      # files (VERSION, CHANGELOG.md, release-notes/, the three manifests), and names the commit
      # underneath. Anything else - a person's commit, a commit that touches a source file - stops
      # the walk at once, which is the whole of why it is safe: nothing that can change what is
      # built is ever walked over. The build and the tag still use master's head; only the question
      # *which run was green* is asked of the commit below it.
      - name: Which commit ci ran on
        id: cicommit
        shell: pwsh
        run: ./tools/release.ps1 -Action ci-commit -Sha '${{ steps.plan.outputs.sha }}'

      # A release reads the run of a PUSH to master, as it always has. A dry run of a branch has
      # no such run - ci.yml's push trigger is master's alone - so there the event is not filtered
      # and the pull request's own green run is what answers.
      - name: Wait for the ci workflow of that commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.cicommit.outputs.ci_sha }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          set -euo pipefail
          event=(--event push)
          if [ "$RELEASE" != "true" ]; then event=(); fi
          for _ in $(seq 1 60); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" "${event[@]}" --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            status=$(echo "$run" | jq -r '.status // "none"')
            conclusion=$(echo "$run" | jq -r '.conclusion // ""')
            echo "ci for $SHA: $status $conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then exit 0; fi
              echo "::error::ci ended as '$conclusion' for $SHA: $(echo "$run" | jq -r '.url'). Nothing is released."
              exit 1
            fi
            sleep 20
          done
          echo "::error::ci has not completed for $SHA within 20 minutes. A release of a commit ci has not passed is refused."
          exit 1

  build:
    name: build (${{ matrix.env }})
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same list as ci.yml. Adding a board is one line in both.
        env: [heltec_v3, heltec_v4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      - name: Install PlatformIO Core
        run: pip install --quiet "platformio==${PIO_VERSION}"

      # The version is a build flag, so it is in the image and not in a file beside it. Since task
      # p1.9-36 this compiles the ESP-IDF from source under sdkconfig.defaults, as ci.yml does and
      # with the same cache key; the bootloader in the merged image is built here too.
      - name: Build with the version baked in
        env:
          PLATFORMIO_BUILD_FLAGS: -D MESHMASTER_AGENT_VERSION='"${{ needs.gate.outputs.version }}"'
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }}
          pio run -e ${{ matrix.env }} -t mergebin

      - name: Name the images after the release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          out=out/release
          mkdir -p "$out"
          # vX.Y.Z in the file name, not the +sha7 build metadata: that is inside the image.
          v="v${VERSION%%+*}"
          build=".pio/build/${{ matrix.env }}"
          cp "$build/firmware.bin"        "$out/meshmaster-agent-${{ matrix.env }}-$v.bin"
          cp "$build/firmware-merged.bin" "$out/meshmaster-agent-${{ matrix.env }}-$v-merged.bin"
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.env }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: ${{ needs.gate.outputs.release == 'true' && 'publish the release' || 'dry run (nothing published)' }}
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      # contents: the Release and its tag, and the branch the pull request below is made of.
      # pull-requests: that pull request, opened and merged by this job's own token.
      contents: write
      pull-requests: write
    steps:
      # fetch-depth 0, because the notes are compiled from git: the order of the bullets is the
      # order the tasks MERGED, read off the commit that added each line along master's first
      # parent.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out/release

      # This release's own lines, in the order the tasks merged, as the bullets they will be. A dry
      # run with nothing waiting says so instead of failing: a real release has already been
      # refused by the gate for that, and a rehearsal is allowed to be of a release with no lines.
      - name: What's new, from the lines the tasks left
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'out/release/WHATSNEW.md'
          try { ./tools/release.ps1 -Action notes -Out $out }
          catch {
            if ('${{ needs.gate.outputs.release }}' -eq 'true') { throw }
            Write-Host $_.Exception.Message
            [System.IO.File]::WriteAllText($out, "_Nothing is waiting in ``release-notes/unreleased/``; a real release would refuse. This is a dry run._`n")
          }

      - name: SHA256SUMS and the notes
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
          RELEASE: ${{ needs.gate.outputs.release }}
        run: |
          set -euo pipefail
          cd out/release

          sha256sum ./*.bin | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

          v="v${VERSION%%+*}"
          pin=$(sed -n 's/^pin = \(.*\)$/\1/p' ../../platformio.ini | head -1)
          tag=$(sed -n 's/^tag = \(.*\)$/\1/p' ../../platformio.ini | head -1)
          {
            echo "MeshMaster agent firmware $v, built from \`${SHA:0:7}\` on MeshCore \`$tag\` (\`${pin:0:8}\`)."
            echo
            echo "The board reports \`$VERSION\` in its heartbeat and on its serial console."
            if [ "$RELEASE" != "true" ]; then
              echo
              echo "**This is a dry run.** The images are the workflow's artifacts and nothing is published."
            fi
            # The lines the tasks left, compiled by tools/release.ps1 in the step above. Everything
            # below this is standing text: it belongs to the file and not to a version, and a task
            # that changes what a person types or flashes edits it here.
            echo
            echo "## What's new in $TAG"
            echo
            cat WHATSNEW.md
            echo
            echo "## Flashing"
            echo
            echo "With the MeshCore web flasher, <https://meshcore.io>, in Chrome or Edge:"
            echo "choose **Custom firmware** and the file for your board."
            echo
            echo "| Board | First install: a new board, or one running other firmware | Upgrade: a board already running this firmware |"
            echo "|---|---|---|"
            for f in meshmaster-agent-*-"$v"-merged.bin; do
              board="${f#meshmaster-agent-}"; board="${board%-"$v"-merged.bin}"
              case "$board" in
                heltec_v3) label="Heltec V3" ;;
                heltec_v4) label="Heltec V4" ;;
                *) label="$board" ;;
              esac
              echo "| $label | \`$f\` | \`meshmaster-agent-$board-$v.bin\` |"
            done
            cat <<'EOF'

          - **First install: the `-merged.bin`.** The flasher erases the whole board before it writes
            it, and says so. The board comes up with a new key and no settings: set it up below.
          - **Upgrade: the plain `.bin`.** It replaces the firmware and keeps the WiFi, the token and
            the board's key. **Never upgrade with the `-merged.bin`**: the erase takes the key with it,
            and the exit node then needs a new token and its associations made again, because the
            repeaters know it by that key.
          - **An upgrade needs nothing typed.** Every setting the board already has is kept.
          - **The `-merged.bin`'s bootloader is the one `v0.6.0` introduced, and is still untried on
            a board.** It is built from source with the firmware (13 936 bytes where the core's
            precompiled one was 15 104), with the same header, the same flash mode, size and
            frequency, and the same partition table byte for byte - but no first install from 0x0
            with it is on record. The plain `.bin` does not touch it, so an **upgrade is
            unaffected**. A **first install** is the case to watch: if a board stays silent after the
            flash instead of printing its banner at 115200, that is this, and `v0.5.0`'s
            `-merged.bin` is the way back.

          `SHA256SUMS` lists every file.

          ## Setting it up

          On the serial console at 115200 baud: the flasher's **Console**, or any terminal. Each `set`
          is stored at once; nothing needs a `save` or a reboot.

          **WiFi and MeshMaster**

          ```
          set wifi.ssid <network name>
          set wifi.pass <WiFi password>
          set meshmaster.token <token>
          status
          ```

          The token is on meshmaster.dk: *Exit nodes → New* for a new exit node, or *Generate a new
          token* on an existing exit node's page. `status` shows the WiFi, the time and the server's
          last answer; if the token is wrong, the display says `token revoked/wrong`.

          **The observer** (optional): every packet the board hears, published to MeshView.dk and
          MeshMapper.net, signed in with the board's own key. It is off until a slot is set.

          ```
          set mqtt.iata AAR
          set mqtt.owner <your own node's public key>
          set mqtt1.preset meshview
          get mqtt.status
          ```

          **On either board, add MeshMapper as the second broker**: `set mqtt2.preset meshmapper`.
          Both boards have had the memory for two slots since `v0.6.0`, whose lighter TLS took a
          broker connection from 63 564 bytes of heap to 19 468; the walk of 2 November measured a
          V3 keeping two brokers and a MeshMaster handshake with about 55 000 bytes still free. A V3
          that came from `v0.5.0` with a second slot already stored in it opens that slot instead of
          showing it off with the reason.

          The gate has not changed and is still what decides, board by board: a slot the heap cannot
          take stays `waiting-for-heap` and looks again every five seconds, and a MeshMaster call
          that comes near the floor closes the highest slot for ten minutes and counts it as `gave
          way`. `get mqtt.status`'s `memory` line prints the sum a slot opens above and the heap as
          it is now. On a V4 the TLS buffers go to its PSRAM; **two slots on a V4 are expected, not
          walked** - the figures are the V3's.

          `mqtt.iata` is your region: `AAL`, `AAR`, `BLL`, `ODE`, `CPH` or `RNN`. `mqtt.owner` is
          optional. The Danish observer guide's lines (`set mqtt1.preset custom`, …) work as typed
          too, every one of them on both boards.

          **Naboer (neighbours)**: the board also publishes the repeaters it hears at zero hops and
          the scopes each one answers with — MeshView's *Direct neighbours* — once a day. Nothing to
          type: `set mqtt.neighbors on` is the default (the guide's line is accepted as typed, and
          `set mqtt.neighbors off` turns it off). To try it now, and see the table:

          ```
          discover.scopes
          get mqtt.status
          ```

          Sixty seconds of discovery, then one regions request per neighbour on the board's own
          airtime budget, and the report goes to every connected broker; `get mqtt.status`'s `nbr:`
          line says when the next one runs and how the last one went. The status message carries
          the noise floor, the air time and the battery, which MeshView showed as *—*.

          **The flood scope**: nothing to type. `set flood.scope dk` is the default — the Danish
          standard's region, which every repeater that follows it forwards — and it needs typing only
          to change it:

          ```
          get flood.scope
          set flood.scope dk-aarhus
          set flood.scope *
          ```

          A *flood* is what the board sends when it has no path to a repeater: a login, and path
          discovery. Each one carries the region's transport code, and the second try of a
          transaction drops it, for the repeaters that have no region map yet. `*` is every flood
          with no scope at all, and `set flood.unscoped never` turns off that second try.
          `status`'s `flood` line counts which shape was answered.

          Every command and setting: `docs/console.md` and `docs/observer.md` in the repository.
          EOF
          } > NOTES.md
          cat NOTES.md

      # The tag is made here, on master's head, by the Release itself. Nothing was pushed by hand
      # and a tag pushed by hand starts nothing: this is the one way a release of this repository
      # is made. **Latest**, because it is.
      - name: Publish
        if: needs.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "MeshMaster agent firmware $TAG" \
            --notes-file out/release/NOTES.md \
            --latest \
            out/release/*.bin out/release/SHA256SUMS
          echo "Released **$TAG** from \`${SHA:0:7}\`, with ${{ needs.gate.outputs.lines }} line(s) of notes." >> "$GITHUB_STEP_SUMMARY"

      # AFTER the release is out and never before it: the lines it published move out of
      # release-notes/unreleased/ into release-notes/vX.Y.Z.md, the version moves to the next patch
      # in all four places, and CHANGELOG.md's next section opens. The commit touches those files
      # and nothing else, which is what lets the NEXT release read ci's verdict from the commit
      # underneath it (the gate's *Which commit ci ran on*).
      #
      # BY A PULL REQUEST, not a push, for meshmaster.dk's reason (its tasks/phase-4.22/161):
      # master requires a pull request before merging and GitHub's bypass lists take people, teams,
      # roles and GitHub Apps, never the Actions token. The one setting it depends on is
      # Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
      #
      # The release stands whatever happens here. A pull request that cannot be merged is left
      # OPEN, this step goes red with the summary saying so, and the next release refuses - "the
      # tag of the version already exists" - until somebody merges it or moves the version by hand.
      # Nothing is undone and nothing is lost.
      - name: Move the notes and the version on, by a pull request
        if: needs.gate.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          # Explicitly, because this step's every `git` and `gh` is checked by its exit code and
          # not by an exception: PowerShell 7.4 turns a native command's non-zero exit into a
          # terminating error when the preference is Stop, and the merge below is allowed three
          # tries. GitHub's pwsh wrapper sets Stop, so this is a deliberate undoing of that.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }

          $branch = "release/$($env:TAG)"
          $title = "$($env:TAG) is out: the notes filed and the version moved on"

          function Stop-WithThePullRequestOpen {
            param([string]$What, [int]$Code)

            @(
              "### $($env:TAG) is published; its pull request is not merged",
              '',
              "The release is out and nothing needs undoing. Only the pull request that files its notes and moves the version on did not land: $What.",
              '',
              "Until it does, the next press refuses with *the tag $($env:TAG) already exists* - which is the point: the version has not moved. Merge the pull request from ``$branch`` by hand, or move VERSION and the three manifests to the next patch yourself (docs/release.md).",
              '',
              'Two things cause it: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" was switched off, or master changed one of the release''s own files while this run was publishing.'
            ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
            throw "$What ($Code)"
          }

          # The release is already out, so from here on every failure is the pull request's and is
          # reported as one.
          try { ./tools/release.ps1 -Action move -Sha $env:SHA }
          catch { Stop-WithThePullRequestOpen "the move itself failed: $($_.Exception.Message)" 1 }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- VERSION CHANGELOG.md release-notes lib/agent-core/library.json lib/agent-core/idf_component.yml lib/agent-core/include/agent/Version.h
          # Nothing else may ride along: the gate of the next release walks over this commit only
          # because every file in it is the release's own.
          $stray = @(git diff --cached --name-only | Where-Object { $_ -notmatch '^(VERSION|CHANGELOG\.md|release-notes/|lib/agent-core/(library\.json|idf_component\.yml|include/agent/Version\.h))' })
          if ($stray.Count -gt 0) { throw "the release's commit would carry $($stray -join ', ')" }

          git commit -m $title
          if ($LASTEXITCODE -ne 0) { throw "the release's commit failed with $LASTEXITCODE" }

          # The commit sits on the detached HEAD this job checked out, and the push is what makes
          # the branch: there is then no local branch of that name for --delete-branch to tidy up.
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { Stop-WithThePullRequestOpen "the branch $branch could not be pushed" $LASTEXITCODE }

          $body = @(
            "**$env:TAG is published.** This is what a release leaves behind, and the workflow that published it opened and merged this (``.github/workflows/release.yml``, docs/release.md):",
            '',
            "- the lines that release shipped, out of ``release-notes/unreleased/`` and into ``release-notes/$($env:TAG).md``, as published;",
            '- the version moved to the next patch in the four places that carry it: `VERSION`, `lib/agent-core/include/agent/Version.h`, `lib/agent-core/library.json` and `lib/agent-core/idf_component.yml`;',
            "- ``CHANGELOG.md``'s next section opened above the released one, so the file reads right at ``$($env:TAG)`` for a consumer that pins it.",
            '',
            'No check runs on this pull request: GitHub starts no workflow from an event raised with the job''s own token. It needs none - the commit touches the release''s own files and nothing else, and the next release''s *ci is green* gate reads its verdict from the commit underneath this one for exactly that reason.',
            '',
            'Until this lands, the next press refuses: the tag of the version it would release already exists.'
          ) -join "`n"
          $url = @(gh pr create --base master --head $branch --title $title --body $body)[-1]
          if ($LASTEXITCODE -ne 0) { Stop-WithThePullRequestOpen "the pull request for $branch could not be opened" $LASTEXITCODE }
          Write-Host $url
          $number = ($url -split '/')[-1]

          # SQUASHED, so master gets ONE commit touching the release's own files - which is the
          # shape the gate of the next release knows how to walk over. GitHub works out whether a
          # pull request can be merged after it is opened, so a merge asked for in the same second
          # can be told it is not ready yet: three tries, ten seconds apart. And the STATE of the
          # pull request decides, not gh's exit code, because gh also tidies the branch up
          # afterwards and a release must not go red over that.
          $merged = $false
          foreach ($attempt in 1..3) {
            gh pr merge $number --squash --delete-branch --subject $title --body ''
            if ($LASTEXITCODE -eq 0) { $merged = $true; break }
            if (@(gh pr view $number --json state --jq '.state')[-1] -eq 'MERGED') { $merged = $true; break }
            Write-Host "attempt $attempt to merge pull request $number answered $LASTEXITCODE"
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          if (-not $merged) { Stop-WithThePullRequestOpen "pull request $number, from $branch, could not be merged" $LASTEXITCODE }

          "$($env:TAG)'s notes and version went to master as pull request $number, squashed from ``$branch``." >> $env:GITHUB_STEP_SUMMARY

      - name: The dry run's output, for the record
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ needs.gate.outputs.sha }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 14
