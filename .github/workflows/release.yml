# WHERE THIS RUNS: all three jobs on GitHub's runners, like every job of ci.yml and upstream.yml,
# because **this repository is public**. Actions on standard GitHub-hosted runners are free in a
# public repository, and a public repository is the one place a self-hosted runner must not be: a
# fork can open a pull request that changes a workflow, and it would then run on the Unraid host.
# It is the stronger reason here than anywhere - this is the file that builds the images people
# flash and signs them into a Release. ci.yml's guard, tools/check-runners.py, fails if any job of
# any workflow here moves to a self-hosted runner (task p1.8-29).
#
# The release: a GitHub Release with, per board, the image to flash.
#
#   push a tag vX.Y.Z   -> wait for ci to be green on that commit -> build every board -> publish
#   workflow_dispatch   -> the same build, published nowhere: a dry run whose artifacts are the
#                          proof that the tag path works. Input "ref": the commit to rehearse on.
#
# Same shape as twinoak/meshmaster.dk's release.yml, minus the deploy: pushing the tag IS the
# approval, nothing is released whose CI is red or unknown, and an older commit is a rollback.
#
# Per board it publishes:
#   meshmaster-agent-<board>-vX.Y.Z.bin          the application image at 0x10000: the upgrade
#                                                for a board already running this firmware
#   meshmaster-agent-<board>-vX.Y.Z-merged.bin   bootloader + partitions + application, one file,
#                                                flashed at 0x0 on a board out of the box or one
#                                                coming from other firmware
#   SHA256SUMS                                   for all of them, one file
# Either image keeps a provisioned board's settings and its identity: this firmware's partition
# table puts NVS above the application, where a merged image cannot reach it (boards/README.md,
# task p1.2-11). The one exception is the first merged flash over a board provisioned under
# v0.1.1 or earlier, whose table kept NVS at 0x9000 inside the span a merged image fills with
# 0xFF: that flash forgets the settings and not the identity. The notes are for a person with
# the MeshCore web flasher (its *Custom firmware* writes a -merged.bin at 0x0 after erasing the
# whole flash, and any other .bin at 0x10000): which file is a first install and which is an
# upgrade, the console lines that set up WiFi, the token and the observer, and the MeshCore tag.
#
# The version the board reports is the tag: -D MESHMASTER_AGENT_VERSION="X.Y.Z+<sha7>", which
# src/version.cpp turns into the string F-01's `status` command and the heartbeat's agentVersion
# read. A dry run says 0.0.0-dryrun+<sha7> so an artifact can never be mistaken for a release.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to rehearse the release on. Empty: this workflow's ref."
        type: string
        default: ""

permissions:
  contents: read

# One release at a time, and none is ever cancelled half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PIO_VERSION: "6.1.19"
  PYTHONUNBUFFERED: "1"

jobs:
  # Nothing is released whose build and tests are red or unknown. A tag on a commit ci has not
  # passed is refused here, before anything is built.
  ci-green:
    name: ci is green for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
      release: ${{ steps.commit.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: The commit, and the version it is released as
        id: commit
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}+${sha:0:7}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0-dryrun+${sha:0:7}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME -> $version" >> "$GITHUB_STEP_SUMMARY"

      # The commit a tag names must be one of master's: a tag on a side branch is not a release.
      - name: And that it is on master
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master \
            || { echo "::error::$(git rev-parse HEAD) is not a commit of master"; exit 1; }

      - name: Wait for the ci workflow of that commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            status=$(echo "$run" | jq -r '.status // "none"')
            conclusion=$(echo "$run" | jq -r '.conclusion // ""')
            echo "ci for $SHA: $status $conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then exit 0; fi
              echo "::error::ci ended as '$conclusion' for $SHA: $(echo "$run" | jq -r '.url'). Nothing is released."
              exit 1
            fi
            sleep 20
          done
          echo "::error::ci has not completed for $SHA (no green push run within 20 minutes). A tag on a commit ci has not passed is refused."
          exit 1

  build:
    name: build (${{ matrix.env }})
    needs: ci-green
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same list as ci.yml. Adding a board is one line in both.
        env: [heltec_v3, heltec_v4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      - name: Install PlatformIO Core
        run: pip install --quiet "platformio==${PIO_VERSION}"

      # The version is a build flag, so it is in the image and not in a file beside it. Since task
      # p1.9-36 this compiles the ESP-IDF from source under sdkconfig.defaults, as ci.yml does and
      # with the same cache key; the bootloader in the merged image is built here too.
      - name: Build with the version baked in
        env:
          PLATFORMIO_BUILD_FLAGS: -D MESHMASTER_AGENT_VERSION='"${{ needs.ci-green.outputs.version }}"'
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }}
          pio run -e ${{ matrix.env }} -t mergebin

      - name: Name the images after the release
        env:
          VERSION: ${{ needs.ci-green.outputs.version }}
        run: |
          set -euo pipefail
          out=out/release
          mkdir -p "$out"
          # vX.Y.Z in the file name, not the +sha7 build metadata: that is inside the image.
          v="v${VERSION%%+*}"
          build=".pio/build/${{ matrix.env }}"
          cp "$build/firmware.bin"        "$out/meshmaster-agent-${{ matrix.env }}-$v.bin"
          cp "$build/firmware-merged.bin" "$out/meshmaster-agent-${{ matrix.env }}-$v-merged.bin"
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.env }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: ${{ needs.ci-green.outputs.release == 'true' && 'publish the release' || 'dry run (nothing published)' }}
    needs: [ci-green, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out/release

      - name: SHA256SUMS and the notes
        env:
          VERSION: ${{ needs.ci-green.outputs.version }}
          SHA: ${{ needs.ci-green.outputs.sha }}
          RELEASE: ${{ needs.ci-green.outputs.release }}
        run: |
          set -euo pipefail
          cd out/release

          sha256sum ./*.bin | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

          v="v${VERSION%%+*}"
          pin=$(sed -n 's/^pin = \(.*\)$/\1/p' ../../platformio.ini | head -1)
          tag=$(sed -n 's/^tag = \(.*\)$/\1/p' ../../platformio.ini | head -1)
          {
            echo "MeshMaster agent firmware $v, built from \`${SHA:0:7}\` on MeshCore \`$tag\` (\`${pin:0:8}\`)."
            echo
            echo "The board reports \`$VERSION\` in its heartbeat and on its serial console."
            if [ "$RELEASE" != "true" ]; then
              echo
              echo "**This is a dry run.** The images are the workflow's artifacts and nothing is published."
            fi
            # This release's own lines. Version-specific, like the console section below: the task
            # that ships a tag rewrites it (p1.8-35, p1.9-37, p1.10-51), and CHANGELOG.md is the per-tag record.
            cat <<'EOF'

          ## What's new since v0.6.0

          Thirteen changes. The first four are what you will see on meshmaster.dk the day you flash
          this one, and they are all about repeaters that answer slowly, and about the access-list
          entry an exit node is given and gives back.

          - **A slow repeater is no longer reported as *the ACL entry is gone*.** While the board
            waits for a login reply, an answer that is not one - a late reply to the request before
            it - is now dropped and the wait goes on, instead of being taken for the login's own
            answer. So a login the repeater never refused is never reported `unauthorized`, and the
            board says *refused* of a login only when the repeater answered it **below** the class
            the job asked for. On 12 November meshmaster.dk parked ten working ACL associations as
            *the ACL entry is gone* for want of this.
          - **A grant whose "OK" was lost is confirmed by a login, and not failed.**
            `setperm <this board's key> <level>` is the session's own level on a repeater: the
            moment it runs, the repeater stops answering this board's console lines, so the line
            cannot be asked twice and a missed "OK" used to fail the job. It now goes **once**, and
            what it did is read back with a blank login - answered at the level asked for is the
            confirmation, by the login and not by an "OK". meshmaster.dk lost 20 of 52 grants, and
            found one association *elevated* seven times in 39 days, for want of it.
          - **An admin job through an exit node that holds no grant leaves no key behind.** Logging
            in with an admin password writes this board's key into the repeater's access list at
            **admin**, and the repeater saves it to flash - so a daily configuration read through a
            guest association used to leave an admin entry on every repeater it touched. Where
            meshmaster.dk says this board should hold nothing there, the session's last command is
            now `setperm <own key> 0`, and the job's result reports what became of the entry in the
            same place a restore is reported. It costs one more exchange a day per repeater whose
            association is a guest one.
          - **A guest answer the job can use, and the owner info at any class.** A repeater answers
            *Read the status* and *Read the neighbours* to anyone, guest included. When the ACL
            entry is gone or demoted, the reading those two jobs got is now **kept** and reported
            `ok` beside the tier the login was given, instead of being thrown away with the login -
            and the server moves the association exactly as it did before. A status read also asks
            for the owner info at **any** class now, so *Name on the radio* and *Owner info* fill on
            a repeater this board has only a guest door to. Everything else is judged as it was:
            `telemetry` at guest is still refused, and a `get` is still admin's.

          Then the rest, one line each:

          - **A job's log reads line by line** on the job's page, one entry per line as the .NET
            agent writes it; a log that fills its kilobyte drops whole entries and never begins
            mid-word.
          - **A trace to a direct neighbour goes at the board's own two bytes**, so its hops are
            four hex digits where they were two and two repeaters that share a first byte can be
            told apart.
          - **An empty `get` reply is a value.** A repeater whose `guest.password` is unset answers
            `"> "`, which now reaches meshmaster.dk as *none* instead of as an unreadable line - so
            a guest password taken off a repeater no longer stays stored on the server until
            somebody clears it by hand.
          - **Every console line of a job carries the repeater's own two-character prefix**, where
            the repeater's firmware reflects one, and only a reply that carries this line's prefix
            is its answer. Nobody has seen a configuration read take the value of the line above it;
            this is what stops it.
          - **Four changes for the other consumer of this repository's `lib/agent-core`** - the
            Walter of a repeater-v2 unit, which reaches its own repeater over a wire: such a job is
            no longer paced or priced as airtime, it logs in with no password at any class, and a
            board that sleeps can tell the library how long it was away, so a 30 s backoff is no
            longer spent five seconds at a time. **None of the four changes anything on a Heltec**,
            which has no such door and does not sleep.

          **What no board has run.** None of the thirteen sessions could open a serial port - every
          change above was built and held to the host test suite and to the agent's contract
          fixtures, and nothing of it has been on the air - so the walks are still to be made with a
          board on the bench: a guest-class read that keeps its reading, an owner info at guest, a
          grant whose "OK" never came home, and a key taken off a repeater.
          EOF
            echo
            echo "## Flashing"
            echo
            echo "With the MeshCore web flasher, <https://meshcore.io>, in Chrome or Edge:"
            echo "choose **Custom firmware** and the file for your board."
            echo
            echo "| Board | First install: a new board, or one running other firmware | Upgrade: a board already running this firmware |"
            echo "|---|---|---|"
            for f in meshmaster-agent-*-"$v"-merged.bin; do
              board="${f#meshmaster-agent-}"; board="${board%-"$v"-merged.bin}"
              case "$board" in
                heltec_v3) label="Heltec V3" ;;
                heltec_v4) label="Heltec V4" ;;
                *) label="$board" ;;
              esac
              echo "| $label | \`$f\` | \`meshmaster-agent-$board-$v.bin\` |"
            done
            cat <<'EOF'

          - **First install: the `-merged.bin`.** The flasher erases the whole board before it writes
            it, and says so. The board comes up with a new key and no settings: set it up below.
          - **Upgrade: the plain `.bin`.** It replaces the firmware and keeps the WiFi, the token and
            the board's key. **Never upgrade with the `-merged.bin`**: the erase takes the key with it,
            and the exit node then needs a new token and its associations made again, because the
            repeaters know it by that key.
          - **An upgrade needs nothing typed.** Every setting the board already has is kept, and this
            release adds none: no new setting, no new console line, and nothing to provision again.
          - **The `-merged.bin`'s bootloader is the one `v0.6.0` introduced, and is still untried on
            a board.** It is built from source with the firmware (13 936 bytes where the core's
            precompiled one was 15 104), with the same header, the same flash mode, size and
            frequency, and the same partition table byte for byte - but no first install from 0x0
            with it is on record. The plain `.bin` does not touch it, so an **upgrade is
            unaffected**. A **first install** is the case to watch: if a board stays silent after the
            flash instead of printing its banner at 115200, that is this, and `v0.5.0`'s
            `-merged.bin` is the way back.

          `SHA256SUMS` lists every file.

          ## Setting it up

          On the serial console at 115200 baud: the flasher's **Console**, or any terminal. Each `set`
          is stored at once; nothing needs a `save` or a reboot.

          **WiFi and MeshMaster**

          ```
          set wifi.ssid <network name>
          set wifi.pass <WiFi password>
          set meshmaster.token <token>
          status
          ```

          The token is on meshmaster.dk: *Exit nodes → New* for a new exit node, or *Generate a new
          token* on an existing exit node's page. `status` shows the WiFi, the time and the server's
          last answer; if the token is wrong, the display says `token revoked/wrong`.

          **The observer** (optional): every packet the board hears, published to MeshView.dk and
          MeshMapper.net, signed in with the board's own key. It is off until a slot is set.

          ```
          set mqtt.iata AAR
          set mqtt.owner <your own node's public key>
          set mqtt1.preset meshview
          get mqtt.status
          ```

          **On either board, add MeshMapper as the second broker**: `set mqtt2.preset meshmapper`.
          Both boards have had the memory for two slots since `v0.6.0`, whose lighter TLS took a
          broker connection from 63 564 bytes of heap to 19 468; the walk of 2 November measured a
          V3 keeping two brokers and a MeshMaster handshake with about 55 000 bytes still free. A V3
          that came from `v0.5.0` with a second slot already stored in it opens that slot instead of
          showing it off with the reason.

          The gate has not changed and is still what decides, board by board: a slot the heap cannot
          take stays `waiting-for-heap` and looks again every five seconds, and a MeshMaster call
          that comes near the floor closes the highest slot for ten minutes and counts it as `gave
          way`. `get mqtt.status`'s `memory` line prints the sum a slot opens above and the heap as
          it is now. On a V4 the TLS buffers go to its PSRAM; **two slots on a V4 are expected, not
          walked** - the figures are the V3's.

          `mqtt.iata` is your region: `AAL`, `AAR`, `BLL`, `ODE`, `CPH` or `RNN`. `mqtt.owner` is
          optional. The Danish observer guide's lines (`set mqtt1.preset custom`, …) work as typed
          too, every one of them on both boards.

          **Naboer (neighbours)**: the board also publishes the repeaters it hears at zero hops and
          the scopes each one answers with — MeshView's *Direct neighbours* — once a day. Nothing to
          type: `set mqtt.neighbors on` is the default (the guide's line is accepted as typed, and
          `set mqtt.neighbors off` turns it off). To try it now, and see the table:

          ```
          discover.scopes
          get mqtt.status
          ```

          Sixty seconds of discovery, then one regions request per neighbour on the board's own
          airtime budget, and the report goes to every connected broker; `get mqtt.status`'s `nbr:`
          line says when the next one runs and how the last one went. The status message now carries
          the noise floor, the air time and the battery, which MeshView showed as *—*.

          **The flood scope**: nothing to type. `set flood.scope dk` is the default — the Danish
          standard's region, which every repeater that follows it forwards — and it needs typing only
          to change it:

          ```
          get flood.scope
          set flood.scope dk-aarhus
          set flood.scope *
          ```

          A *flood* is what the board sends when it has no path to a repeater: a login, and path
          discovery. Each one now carries the region's transport code, and the second try of a
          transaction drops it, for the repeaters that have no region map yet. `*` is every flood
          with no scope at all, and `set flood.unscoped never` turns off that second try.
          `status`'s `flood` line counts which shape was answered.

          Every command and setting: `docs/console.md` and `docs/observer.md` in the repository.
          EOF
          } > NOTES.md
          cat NOTES.md

      - name: Publish
        if: needs.ci-green.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MeshMaster agent firmware $GITHUB_REF_NAME" \
            --notes-file out/release/NOTES.md \
            out/release/*.bin out/release/SHA256SUMS

      - name: The dry run's output, for the record
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ needs.ci-green.outputs.sha }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 14
