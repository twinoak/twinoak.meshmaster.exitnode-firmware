# Every pull request and every push to master, once per commit.
#
#   build (per board)   pio run -e <board> for every board of the matrix, and the .bin as an
#                       artifact. heltec_v3 and heltec_v4 since task p1-06. Then -t mergebin and
#                       tools/check-partitions.py against the merged image: the partition table
#                       the environment names is the framework default's with NVS above the
#                       application, and the image ends before NVS begins (task p1.2-11). Since
#                       task p1.9-36 the build compiles the ESP-IDF from source under the
#                       committed sdkconfig.defaults (Arduino as a component), so the step after
#                       it is tools/check-sdkconfig.py: that file is the Arduino core's own
#                       configuration but for the TLS keys it lists, and the generated
#                       sdkconfig.<board> of the build carries them. The cache key names the
#                       file too, because the ESP-IDF's python environment and tools are keyed
#                       by it as much as by platformio.ini
#   native tests        pio test -e native (the host tests: no board, no radio), which since task
#                       p1.5-16 compiles lib/agent-core whole - the job runner and the agent loop
#                       among it - and whose test/test_library holds the library's boundary.
#                       Since task p1.5-17 two of those suites *run* the whole agent against the
#                       fakes of test/support: test_runner is JobRunner end to end over every one
#                       of the thirteen job types, test_loop is AgentLoop's pass, its backoff and
#                       its reboot guard (docs/host.md). Nothing in them sleeps - the clock is the
#                       test's - so they are milliseconds each; what the minute of this job is
#                       spent on is PlatformIO relinking once per suite
#   the library         what moved into lib/agent-core, as a file list a reviewer can read; the
#                       library compiled on its own with an ESP-IDF consumer's flags, in five
#                       configurations since task p1.6-20 - c++17 and gnu++17, each at -O0 and
#                       -O2, and the first consumer's own -O2 under the sanitizers - on this
#                       runner's GCC, which is the consumer's and is named in the log
#                       (tools/check-library-host.py); and its ESP-IDF component file parsed and
#                       held against the sources on disk (tools/check-idf-component.cmake). The
#                       component is not *built* anywhere in this repository - the boards' ESP-IDF
#                       build of p1.9-36 takes the library through PlatformIO's own dependency
#                       finder, not as a component - and the Walter firmware's phase 4 is where
#                       it first compiles
#   fixtures            tools/sync-fixtures.ps1 -Verify - the contract fixtures and the
#                       transcribed companion frames are still meshmaster.dk's bytes and nobody
#                       edited one here
#   the runners         tools/check-runners.py - no job of any workflow in this directory runs on a
#                       self-hosted runner, because this repository is public and a fork's pull
#                       request would otherwise run a stranger's code on the Unraid host (task
#                       p1.8-29). It is the native job's first real step
#   the release         tools/release.ps1 - its `check`, which is the rail of the version living in
#                       ONE place (`VERSION`, naming the release that comes next): the three
#                       manifests that carry the library's version and CHANGELOG.md's top heading
#                       must agree with it, and every line waiting in release-notes/unreleased/
#                       must parse. Then its `-SelfTest`, which builds a scratch repository and
#                       runs the refusals, the compiling of the lines, the move after a release and
#                       the commit the release's *ci is green* gate reads (task p1.11-52,
#                       docs/release.md). Seconds, and no PlatformIO, so it is early
#
# WHERE THIS RUNS. On GitHub's runners (`ubuntu-latest`), like every job of every workflow here,
# for two reasons that both come of the same fact: **this repository is public**. Actions on
# standard GitHub-hosted runners are free in a public repository, so this file has never spent a
# credit - the minutes that got out of hand are meshmaster.dk's and the repeater firmware's, which
# are private and whose CI runs at home on the Unraid runners. And a public repository is the one
# place a self-hosted runner must not be: a fork can open a pull request that changes this file,
# and it would then run on the Unraid host, with its docker socket, its LAN and its Tailscale.
# GitHub's own guidance is that self-hosted runners "should almost never be used for public
# repositories". README's *Where CI runs* is the page, and the guard below is what holds it.
#
# One run per commit is twinoak/meshmaster.dk's rule (its tasks/phase-4/49) and it is here from the
# first commit: a branch push and its pull request are two refs, so the concurrency group below
# cannot collapse them. A pull request is where a check blocks a merge, and a push to master is
# what release.yml's ci-green waits for, so those two are the triggers and a branch push is not one.
#
# A red job blocks the merge: tasks/RUNBOOK.md merges on green only, and the branch protection of
# this repository makes GitHub insist too.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PlatformIO Core is pinned like every other dependency here (tasks/README.md): a firmware build
  # has to be reproducible, and the toolchain it resolves is part of the build.
  PIO_VERSION: "6.1.19"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One line per board. release.yml builds the same list.
        env: [heltec_v3, heltec_v4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The toolchain and every library, keyed by the files that decide them: a hit turns a cold
      # build into a warm one. MeshCore is a git dependency, so the pin is in the key; since task
      # p1.9-36 so is sdkconfig.defaults, which decides the ESP-IDF's python environment and the
      # tools (cmake, ninja) the component build installs under ~/.platformio. What the cache
      # cannot hold is the compiled ESP-IDF itself: .pio/ is the job's own and is not cached, so
      # every run compiles the ESP-IDF from source (the report of p1.9-36 gives the minutes).
      # Every job here runs on a runner that is new, with nothing on disk, so the cache is
      # unconditional - as is the one in the native job below (task p1.8-29).
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      - name: Install PlatformIO Core
        run: pip install --quiet "platformio==${PIO_VERSION}"

      # Timed, because the ESP-IDF is compiled here from source: the step summary says how long,
      # for the day the figure matters.
      - name: Build
        run: |
          set -euo pipefail
          start=$(date +%s)
          pio run -e ${{ matrix.env }}
          echo "build (${{ matrix.env }}): $(( $(date +%s) - start )) s, ESP-IDF from source" >> "$GITHUB_STEP_SUMMARY"

      # The configuration the ESP-IDF was just built with is the Arduino core's own, but for the
      # TLS keys tools/check-sdkconfig.py lists with their reasons: anything else that differs is a
      # red build, and so is a core on disk other than the one the file was copied from. --built
      # reads the sdkconfig.<board> the build generated and holds the same keys against it, so a
      # default that did not take (a dependency unmet, a key the Kconfig does not know) is seen
      # here and not on a board (task p1.9-36). The self-test first: the differences it must refuse.
      - name: The ESP-IDF configuration is the core's, but for the TLS keys
        run: |
          set -euo pipefail
          python tools/check-sdkconfig.py --self-test
          python tools/check-sdkconfig.py --built ${{ matrix.env }}

      # The merged image is what a board out of the box is flashed with, and the partition table
      # it carries is where NVS, SPIFFS (the identity) and the application live. The check holds
      # the table this environment names against the framework's default for the board's flash
      # size - spiffs, coredump, otadata and app0 unmoved, nvs above the application, the gap at
      # 0x9000 empty - and then that the merged image really ends before nvs begins, so the day
      # the application grows past its region this step says so before a release does
      # (boards/README.md, task p1.2-11). The self-test first: the two tables it must refuse.
      - name: The merged image, and the partition table it carries
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} -t mergebin
          python tools/check-partitions.py --self-test
          python tools/check-partitions.py --env ${{ matrix.env }} --merged ".pio/build/${{ matrix.env }}/firmware-merged.bin"

      # -Werror is on for src/ (platformio.ini's build_src_flags), so a warning of our own has
      # already failed the step above. This is the size of what was built, for the record.
      - name: What was built
        run: |
          set -euo pipefail
          ls -la ".pio/build/${{ matrix.env }}/firmware.bin"
          {
            echo "### ${{ matrix.env }}"
            echo '```'
            pio run -e ${{ matrix.env }} 2>&1 | grep -E '^(RAM|Flash):' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.elf
          if-no-files-found: error
          retention-days: 14

  native:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The guard, before anything is installed or built, because it is about this directory and
      # not about the firmware: no job of any workflow here runs on a self-hosted runner, because
      # this repository is public and a fork's pull request would then run on the host. The rule
      # and its reason are at the top of the script, in one place, so that the day someone moves a
      # job home is the day a job goes red rather than the day a stranger's code runs on Unraid.
      # The self-test first: the shapes it must refuse.
      - name: Every job runs where it must
        run: |
          set -euo pipefail
          python tools/check-runners.py --self-test
          python tools/check-runners.py

      # The release's rails and the release script's own tests, before anything is installed: the
      # version is in one place and the four files that carry it agree, the changelog's top section
      # is headed with it, every waiting release note parses - and then the whole of a release,
      # from the refusals to the move afterwards, against a scratch repository in /tmp. A release
      # is one press of a button since task p1.11-52, so what the press does is held by a test
      # rather than by a person reading the workflow. The self-test's own scratch repositories are
      # the fixtures; nothing here touches this one.
      - name: The release is in one place, and does what it says
        shell: pwsh
        run: |
          ./tools/release.ps1 -Action check
          ./tools/release.ps1 -SelfTest

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-${{ env.PIO_VERSION }}-

      - name: Install PlatformIO Core
        run: pip install --quiet "platformio==${PIO_VERSION}"

      # A host build: g++ is the runner's own. On Windows there is none, which is why a session
      # runs this step in a container (tasks/RUNBOOK.md section 2).
      - name: Test
        run: pio test -e native

      # What moved into lib/agent-core, for a reviewer to read without checking out the branch:
      # the library's whole file list, with the manifests at the top of it.
      - name: What the library is
        run: |
          set -euo pipefail
          {
            echo '### lib/agent-core'
            echo '```'
            find lib/agent-core -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find lib/agent-core -type f | sort

      # The library on its own, the ways a consumer builds it: -fno-exceptions and -fno-rtti on
      # top of -Wall -Wextra -Werror, and nothing but lib/agent-core/include and ArduinoJson on
      # the include path. Five configurations since task p1.6-20 - c++17 and gnu++17, each at -O0
      # and -O2, plus the first consumer's own -O2 under AddressSanitizer and
      # UndefinedBehaviorSanitizer - because the two things the first consumer of the library hit
      # were a GNU dialect's predefined `unix` and a warning the optimiser raises after inlining,
      # neither of which a single -std=c++17 -O0 compile can see. **This runner's GCC is the
      # consumer's**, so the script prints the compiler and its version first and the log names
      # it. Before compiling, it holds every identifier of the library against the compiler's own
      # list of predefined macro names; the self-test first, on the planted sources it must catch.
      # It needs the ArduinoJson the step above installed, so it runs after it (task p1.5-16).
      - name: The library compiles for a consumer
        run: |
          set -euo pipefail
          python tools/check-library-host.py --self-test
          python tools/check-library-host.py

      # And its ESP-IDF face: a syntax check of lib/agent-core/CMakeLists.txt with a stub
      # idf_component_register, and then the SRCS it registers against lib/agent-core/src on disk,
      # in both directions. cmake is the runner's own; there is no ESP-IDF here and the component
      # is not compiled (twinoak.meshcore.walter-firmware, phase 4, task 01, does that first).
      - name: The ESP-IDF component file
        run: cmake -P tools/check-idf-component.cmake

      # The other half of the fixture rail, for both sets: the native tests check that every
      # fixture is present and well formed, this checks that its bytes are still the ones
      # meshmaster.dk had at the commit MANIFEST.txt records. No network and no token - the
      # hashes are in the manifest.
      - name: The fixtures are still meshmaster.dk's
        shell: pwsh
        run: ./tools/sync-fixtures.ps1 -Verify
